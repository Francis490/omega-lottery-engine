name: Omega Engine Automazione

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

concurrency:
  group: omega-engine
  cancel-in-progress: false

jobs:
  run-omega:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout codice
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Scarica DB aggiornato da Release
        run: |
          if gh release view db-latest >/dev/null 2>&1; then
            gh release download db-latest \
              --pattern "omega.db" \
              --output omega.db \
              --clobber
          else
            echo "Release db-latest assente: il DB verrà ricostruito dai CSV"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Importa Storico Database (solo se DB assente o vuoto)
        run: python import_history.py

      - name: Esegui il Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Scova le anomalie (Hack the System)
        run: python hack_the_system.py

      - name: Test smoke (blocca il commit se falliscono)
        run: pytest -q

      - name: Genera Report Dati (Vortex)
        run: python report_generator.py

      - name: Esporta CSV aggiornati dal DB
        run: python export_csv.py

      - name: Pubblica DB aggiornato su Release
        if: success()
        run: |
          gh release view db-latest >/dev/null 2>&1 \
            || gh release create db-latest \
                 --title "Database Omega Engine" \
                 --notes "Snapshot automatico del DB aggiornato ad ogni run"
          gh release upload db-latest omega.db --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Commit per la PWA
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/latest.json
          git add EJ_ab_2018.csv superenalotto_storico.csv swfl_storico.csv

          if git diff --cached --quiet; then
            echo "Nessuna modifica da committare."
            exit 0
          fi

          git commit -m "Aggiornamento Omega Engine [skip ci]"

          git pull --rebase --autostash -X theirs origin main

          for attempt in 1 2 3; do
            if git push; then
              echo "Push ok (tentativo $attempt)"
              exit 0
            fi
            echo "Push fallito, retry $attempt/3..."
            sleep 5
            git pull --rebase --autostash -X theirs origin main
          done

          echo "Push fallito dopo 3 tentativi."
          exit 1
