name: Omega Engine Automazione

on:
  schedule:
    # Si sveglia TUTTI I GIORNI alle 13:00 UTC (14:00 in Italia, ora solare)
    - cron: '0 13 * * *'
  workflow_dispatch:

concurrency:
  group: omega-engine
  cancel-in-progress: false

jobs:
  run-omega:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout codice
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Ripristina Database
        id: cache-db
        uses: actions/cache/restore@v4
        with:
          path: omega.db
          key: omega-db-${{ github.run_id }}
          restore-keys: |
            omega-db-

      - name: Importa Storico Database
        run: python import_history.py

      - name: Esegui il Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Genera Report Dati (Vortex)
        run: python report_generator.py

      - name: Salva Database Aggiornato
        if: always()
        uses: actions/cache/save@v4
        with:
          path: omega.db
          key: omega-db-${{ github.run_id }}

      - name: Commit per la PWA
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/latest.json
          if git diff --cached --quiet; then
            echo "Nessuna modifica da committare."
            exit 0
          fi
          git commit -m "Aggiornamento Omega Engine [skip ci]"
          git pull --rebase --autostash origin main
          git push
