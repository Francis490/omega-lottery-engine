name: Omega Engine Automazione

on:
  schedule:
    # Si sveglia TUTTI I GIORNI alle 10:00 UTC (11:00 in Italia)
    - cron: '0 10 * * *'
  workflow_dispatch: # Tasto per avvio manuale (solo per test)

jobs:
  run-omega:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout codice
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Ripristina Database
        uses: actions/cache@v3
        with:
          path: omega.db
          key: omega-db-${{ github.run_id }}
          restore-keys: |
            omega-db-

      - name: Esegui il Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Genera Report Dati (Vortex)
        run: python report_generator.py

      - name: Salva Database Aggiornato
        uses: actions/cache@v3
        with:
          path: omega.db
          key: omega-db-${{ github.run_id }}

      - name: Commit per la PWA
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/latest.json
          git commit -m "Aggiornamento Omega Engine [skip ci]" || exit 0
          git pull --rebase origin main
          git push
