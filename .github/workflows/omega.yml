name: Omega Engine Automazione

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

concurrency:
  group: omega-engine
  cancel-in-progress: false

jobs:
  run-omega:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout codice
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Importa Storico Database (solo se DB assente)
        run: python import_history.py

      - name: Esegui il Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Test smoke (blocca il commit se falliscono)
        run: pytest -q

      - name: Genera Report Dati (Vortex)
        run: python report_generator.py

      - name: Esporta CSV aggiornati dal DB
        run: python export_csv.py

      - name: Commit per la PWA
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/latest.json
          git add EJ_ab_2018.csv superenalotto_storico.csv swfl_storico.csv
          git add -f omega.db

          if git diff --cached --quiet; then
            echo "Nessuna modifica da committare."
            exit 0
          fi

          git commit -m "Aggiornamento Omega Engine [skip ci]"

          git pull --rebase --autostash -X ours origin main

          for attempt in 1 2 3; do
            if git push; then
              echo "Push ok (tentativo $attempt)"
              exit 0
            fi
            echo "Push fallito, retry $attempt/3..."
            sleep 5
            git pull --rebase --autostash -X ours origin main
          done

          echo "Push fallito dopo 3 tentativi."
          exit 1
